name: Scrape teams

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Prydwen blocks headless browsers, so run headed under a virtual display.
      - run: xvfb-run --auto-servernum npm run scrape-teams
      - name: Commit updated teams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/teams.json
          git diff --staged --quiet || (git commit -m "Update teams data" && git push)
